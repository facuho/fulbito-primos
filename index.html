<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organizador de Fulbito</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased pb-16">

  <!-- Header -->
  <header class="bg-slate-800/80 border-b border-slate-700/60 sticky top-0 z-30 backdrop-blur-md px-4 py-3">
    <div class="max-w-xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-2xl">⚽</span>
        <h1 class="font-bold text-lg text-emerald-400">Fulbito Primos</h1>
      </div>
      <div id="connectionStatus" class="text-xs px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-400 font-medium">
        Conectado
      </div>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 mt-5 space-y-5">
    
    <!-- Pestañas de navegación -->
    <div class="flex bg-slate-800 p-1 rounded-xl border border-slate-700">
      <button id="tabMyAvailability" onclick="switchTab('my')" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-emerald-600 text-white transition-all shadow-sm">
        Cargar mis horas
      </button>
      <button id="tabGroupHeatmap" onclick="switchTab('group')" class="flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition-all">
        Ver grupo (Heatmap)
      </button>
    </div>

    <!-- VISTA 1: Cargar Disponibilidad Personal -->
    <section id="viewPersonal" class="space-y-4">
      <!-- Input Nombre -->
      <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700/80">
        <label for="userName" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">¿Quién sos?</label>
        <div class="flex gap-2">
          <input type="text" id="userName" placeholder="Tu nombre o apodo (ej: Facu)" 
                 class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-emerald-500 text-white placeholder-slate-500">
          <button onclick="loadUserAvailability()" class="bg-slate-700 hover:bg-slate-600 px-3.5 py-2 text-xs font-medium rounded-xl transition">
            Cargar
          </button>
        </div>
      </div>

      <!-- Leyenda de colores -->
      <div class="flex items-center justify-between text-xs px-2 text-slate-400">
        <span>Tocá para cambiar:</span>
        <div class="flex items-center gap-3">
          <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-emerald-500"></span> Puedo</span>
          <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-amber-500"></span> En duda</span>
          <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-slate-800 border border-slate-600"></span> No</span>
        </div>
      </div>

      <!-- Grilla interactiva personal -->
      <div class="bg-slate-800 p-3 rounded-2xl border border-slate-700 overflow-x-auto shadow-md">
        <div id="personalGrid" class="min-w-[320px]"></div>
      </div>

      <!-- Botón guardar -->
      <button onclick="saveAvailability()" id="btnSave" class="w-full bg-emerald-500 hover:bg-emerald-600 active:scale-[0.99] text-slate-950 font-bold py-3 rounded-xl transition shadow-lg shadow-emerald-500/20">
        Guardar mi disponibilidad
      </button>
      <p id="saveFeedback" class="text-xs text-center text-emerald-400 font-medium hidden">¡Guardado con éxito!</p>
    </section>

    <!-- VISTA 2: Vista Grupal / Heatmap -->
    <section id="viewGroup" class="space-y-4 hidden">
      <!-- Tarjeta Mejor Horario -->
      <div class="bg-gradient-to-r from-emerald-950/60 to-slate-800 p-4 rounded-2xl border border-emerald-500/30 flex items-center justify-between">
        <div>
          <span class="text-xs font-semibold text-emerald-400 uppercase tracking-wider">Mejor horario para jugar</span>
          <div id="bestSlotText" class="text-lg font-bold text-white mt-0.5">Calculando...</div>
        </div>
        <div id="bestSlotCount" class="text-2xl font-black text-emerald-400 bg-emerald-950/80 px-3 py-1 rounded-xl border border-emerald-500/20">
          0
        </div>
      </div>

      <div class="text-xs text-slate-400 px-1">
        Tocá cualquier celda para ver la lista de quiénes pueden:
      </div>

      <!-- Grilla Heatmap -->
      <div class="bg-slate-800 p-3 rounded-2xl border border-slate-700 overflow-x-auto shadow-md">
        <div id="heatmapGrid" class="min-w-[320px]"></div>
      </div>

      <!-- Lista de primos participantes -->
      <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700">
        <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Primos que ya respondieron (<span id="totalVoters">0</span>)</h3>
        <div id="votersList" class="flex flex-wrap gap-2 text-xs"></div>
      </div>
    </section>

  </main>

  <!-- Modal detalle de horario -->
  <div id="slotModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-800 border border-slate-700 p-5 rounded-2xl w-full max-w-sm space-y-4 shadow-2xl">
      <div class="flex items-center justify-between border-b border-slate-700 pb-2">
        <h3 id="modalSlotTitle" class="font-bold text-white text-base">Horario</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white text-xl leading-none">&times;</button>
      </div>
      <div class="space-y-3 text-sm">
        <div>
          <div class="font-semibold text-emerald-400 text-xs mb-1">Confirmados:</div>
          <div id="modalAvailableList" class="text-slate-300">Nadie aún</div>
        </div>
        <div>
          <div class="font-semibold text-amber-400 text-xs mb-1">En duda:</div>
          <div id="modalMaybeList" class="text-slate-300">Nadie</div>
        </div>
        <div>
          <div class="font-semibold text-slate-500 text-xs mb-1">No pueden:</div>
          <div id="modalUnavailableList" class="text-slate-500">Nadie</div>
        </div>
      </div>
      <button onclick="closeModal()" class="w-full bg-slate-700 hover:bg-slate-600 py-2 rounded-xl text-sm font-medium transition">
        Cerrar
      </button>
    </div>
  </div>

  <!-- Lógica JavaScript integrada -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDLdIpZrptvK5WsIFjWYCGT9x-CiLeoB3M",
      authDomain: "fulbito-a69a9.firebaseapp.com",
      databaseURL: "https://fulbito-a69a9-default-rtdb.firebaseio.com",
      projectId: "fulbito-a69a9",
      storageBucket: "fulbito-a69a9.firebasestorage.app",
      messagingSenderId: "614840789857",
      appId: "1:614840789857:web:aa91fe035ed29678f37320",
      measurementId: "G-NKWKM2ZB9P"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const responsesRef = db.ref("fulbito/respuestas");

    const DAYS = ["Jueves", "Viernes", "Sábado", "Domingo"];
    const HOURS = ["17:00", "18:00", "19:00", "20:00", "21:00", "22:00", "23:00"];

    let mySlots = {};
    let allResponses = {};

    function initApp() {
      const savedName = localStorage.getItem("fulbito_username");
      if (savedName) {
        document.getElementById("userName").value = savedName;
      }
      buildPersonalGrid();
      listenToDatabase();
    }

    function buildPersonalGrid() {
      const container = document.getElementById("personalGrid");
      if (!container) return;
      container.innerHTML = "";

      const grid = document.createElement("div");
      grid.className = "grid grid-cols-5 gap-1.5 text-center text-xs";

      grid.appendChild(createHeaderCell("Hora"));
      DAYS.forEach(day => grid.appendChild(createHeaderCell(day.slice(0, 3))));

      HOURS.forEach(hour => {
        grid.appendChild(createTimeCell(hour));
        DAYS.forEach(day => {
          const slotKey = `${day}-${hour}`;
          const cell = document.createElement("button");
          cell.id = `cell-${slotKey}`;
          cell.type = "button";
          cell.className = "h-11 rounded-lg border font-medium flex items-center justify-center transition-all bg-slate-900 border-slate-700/60 text-slate-500 select-none";
          cell.innerText = "—";
          cell.onclick = () => toggleCellState(slotKey, cell);
          grid.appendChild(cell);
        });
      });

      container.appendChild(grid);
      updatePersonalGridVisuals();
    }

    function createHeaderCell(text) {
      const div = document.createElement("div");
      div.className = "font-bold text-slate-400 py-1 uppercase tracking-wider text-[11px]";
      div.innerText = text;
      return div;
    }

    function createTimeCell(hour) {
      const div = document.createElement("div");
      div.className = "flex items-center justify-center font-semibold text-slate-400 text-[11px]";
      div.innerText = hour;
      return div;
    }

    function toggleCellState(slotKey, cell) {
      const currentState = mySlots[slotKey] || "no";
      let nextState = "yes";
      if (currentState === "yes") nextState = "maybe";
      else if (currentState === "maybe") nextState = "no";

      mySlots[slotKey] = nextState;
      renderCellVisual(cell, nextState);
    }

    function renderCellVisual(cell, state) {
      cell.className = "h-11 rounded-lg border font-semibold flex items-center justify-center transition-all select-none ";
      if (state === "yes") {
        cell.className += "bg-emerald-600 border-emerald-500 text-white shadow-sm shadow-emerald-500/20";
        cell.innerText = "✓";
      } else if (state === "maybe") {
        cell.className += "bg-amber-500 border-amber-400 text-slate-950 font-bold";
        cell.innerText = "?";
      } else {
        cell.className += "bg-slate-900 border-slate-700/60 text-slate-500";
        cell.innerText = "—";
      }
    }

    function updatePersonalGridVisuals() {
      DAYS.forEach(day => {
        HOURS.forEach(hour => {
          const slotKey = `${day}-${hour}`;
          const cell = document.getElementById(`cell-${slotKey}`);
          if (cell) {
            renderCellVisual(cell, mySlots[slotKey] || "no");
          }
        });
      });
    }

    function saveAvailability() {
      const rawName = document.getElementById("userName").value.trim();
      if (!rawName) {
        alert("Por favor ingresá tu nombre antes de guardar.");
        return;
      }

      const userId = rawName.toLowerCase().replace(/[^a-z0-9]/g, "_");
      localStorage.setItem("fulbito_username", rawName);

      const payload = {
        name: rawName,
        slots: mySlots,
        updatedAt: Date.now()
      };

      responsesRef.child(userId).set(payload)
        .then(() => {
          const feedback = document.getElementById("saveFeedback");
          feedback.classList.remove("hidden");
          setTimeout(() => feedback.classList.add("hidden"), 3000);
        })
        .catch(err => {
          alert("Error al guardar: " + err.message);
        });
    }

    function loadUserAvailability() {
      const rawName = document.getElementById("userName").value.trim();
      if (!rawName) return;

      const userId = rawName.toLowerCase().replace(/[^a-z0-9]/g, "_");
      if (allResponses[userId]) {
        mySlots = allResponses[userId].slots || {};
        updatePersonalGridVisuals();
        localStorage.setItem("fulbito_username", rawName);
      }
    }

    function listenToDatabase() {
      responsesRef.on("value", snapshot => {
        allResponses = snapshot.val() || {};
        buildHeatmapGrid();
        updateBestSlot();
        updateVotersList();

        const rawName = document.getElementById("userName").value.trim();
        if (rawName) {
          const userId = rawName.toLowerCase().replace(/[^a-z0-9]/g, "_");
          if (allResponses[userId] && Object.keys(mySlots).length === 0) {
            mySlots = allResponses[userId].slots || {};
            updatePersonalGridVisuals();
          }
        }
      });
    }

    function buildHeatmapGrid() {
      const container = document.getElementById("heatmapGrid");
      if (!container) return;
      container.innerHTML = "";

      const grid = document.createElement("div");
      grid.className = "grid grid-cols-5 gap-1.5 text-center text-xs";

      grid.appendChild(createHeaderCell("Hora"));
      DAYS.forEach(day => grid.appendChild(createHeaderCell(day.slice(0, 3))));

      const totalVoters = Object.keys(allResponses).length;

      HOURS.forEach(hour => {
        grid.appendChild(createTimeCell(hour));
        DAYS.forEach(day => {
          const slotKey = `${day}-${hour}`;
          let availableCount = 0;
          let maybeCount = 0;

          Object.values(allResponses).forEach(resp => {
            const state = resp.slots ? resp.slots[slotKey] : "no";
            if (state === "yes") availableCount++;
            else if (state === "maybe") maybeCount++;
          });

          const cell = document.createElement("button");
          cell.type = "button";
          cell.className = "h-11 rounded-lg border font-semibold flex flex-col items-center justify-center transition-all cursor-pointer";
          
          if (availableCount === 0 && maybeCount === 0) {
            cell.className += " bg-slate-900 border-slate-700/60 text-slate-600";
            cell.innerHTML = `<span>0</span>`;
          } else if (availableCount > 0) {
            const ratio = totalVoters > 0 ? (availableCount / totalVoters) : 0;
            if (ratio >= 0.7) cell.className += " bg-emerald-500 border-emerald-400 text-slate-950 font-bold shadow-sm shadow-emerald-500/20";
            else if (ratio >= 0.4) cell.className += " bg-emerald-700 border-emerald-600 text-white";
            else cell.className += " bg-emerald-900/60 border-emerald-800 text-emerald-300";

            cell.innerHTML = `<span>${availableCount}</span>` + (maybeCount > 0 ? `<span class="text-[9px] opacity-80">+${maybeCount}?</span>` : "");
          } else {
            cell.className += " bg-amber-950/60 border-amber-800/80 text-amber-300";
            cell.innerHTML = `<span>${maybeCount}?</span>`;
          }

          cell.onclick = () => openSlotModal(slotKey, day, hour);
          grid.appendChild(cell);
        });
      });

      container.appendChild(grid);
    }

    function updateBestSlot() {
      let bestSlot = null;
      let maxConfirmed = -1;

      DAYS.forEach(day => {
        HOURS.forEach(hour => {
          const slotKey = `${day}-${hour}`;
          let count = 0;
          Object.values(allResponses).forEach(resp => {
            if (resp.slots && resp.slots[slotKey] === "yes") count++;
          });
          if (count > maxConfirmed) {
            maxConfirmed = count;
            bestSlot = `${day} ${hour} hs`;
          }
        });
      });

      const textElem = document.getElementById("bestSlotText");
      const countElem = document.getElementById("bestSlotCount");
      if (textElem && countElem) {
        if (maxConfirmed > 0) {
          textElem.innerText = bestSlot;
          countElem.innerText = `${maxConfirmed} ✓`;
        } else {
          textElem.innerText = "Sin votos aún";
          countElem.innerText = "0";
        }
      }
    }

    function updateVotersList() {
      const voters = Object.values(allResponses).map(r => r.name);
      const totalElem = document.getElementById("totalVoters");
      const container = document.getElementById("votersList");
      if (totalElem) totalElem.innerText = voters.length;
      if (!container) return;
      container.innerHTML = "";

      if (voters.length === 0) {
        container.innerHTML = `<span class="text-slate-500">Ningún voto cargado todavía.</span>`;
        return;
      }

      voters.forEach(name => {
        const badge = document.createElement("span");
        badge.className = "px-2.5 py-1 bg-slate-700/80 rounded-lg text-slate-300 border border-slate-600/60";
        badge.innerText = name;
        container.appendChild(badge);
      });
    }

    function openSlotModal(slotKey, day, hour) {
      document.getElementById("modalSlotTitle").innerText = `${day} a las ${hour} hs`;
      
      const yesList = [];
      const maybeList = [];
      const noList = [];

      Object.values(allResponses).forEach(resp => {
        const state = resp.slots ? resp.slots[slotKey] : "no";
        if (state === "yes") yesList.push(resp.name);
        else if (state === "maybe") maybeList.push(resp.name);
        else noList.push(resp.name);
      });

      document.getElementById("modalAvailableList").innerText = yesList.length ? yesList.join(", ") : "Nadie";
      document.getElementById("modalMaybeList").innerText = maybeList.length ? maybeList.join(", ") : "Nadie";
      document.getElementById("modalUnavailableList").innerText = noList.length ? noList.join(", ") : "Nadie";

      document.getElementById("slotModal").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("slotModal").classList.add("hidden");
    }

    function switchTab(tab) {
      const viewPersonal = document.getElementById("viewPersonal");
      const viewGroup = document.getElementById("viewGroup");
      const tabPersonal = document.getElementById("tabMyAvailability");
      const tabGroup = document.getElementById("tabGroupHeatmap");

      if (tab === "my") {
        viewPersonal.classList.remove("hidden");
        viewGroup.classList.add("hidden");
        tabPersonal.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-emerald-600 text-white transition-all shadow-sm";
        tabGroup.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition-all";
      } else {
        viewPersonal.classList.add("hidden");
        viewGroup.classList.remove("hidden");
        tabPersonal.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition-all";
        tabGroup.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-emerald-600 text-white transition-all shadow-sm";
      }
    }

    // Inicializar al cargar el DOM
    document.addEventListener("DOMContentLoaded", initApp);
  </script>
</body>
</html>
